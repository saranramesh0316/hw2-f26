<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --g0:#03120c;--g1:#0a2e20;--g2:#12503a;--g3:#1b6d4e;--g4:#27916a;--g5:#5cc094;
  --grad:linear-gradient(180deg,#1f5c3c 0%,#1a5034 25%,#144129 50%,#0f3320 75%,#0a2617 100%);
  --btn-grad:linear-gradient(180deg,var(--g3),var(--g2));
  --bg:var(--g0);--panel:#0c241a;--panel2:#0a1f16;--ink:#ece9db;--muted:#c4d4ca;--line:#5cc094;--line-soft:#1f3f31;--rule:#2f5f4a;
  --link:#8fdcb8;--focus:#8fdcb8;--tint:#153a2a;--danger:#f0928a;--ok:#5cc094;--lock:#102a1f;
  --paper-edge:rgba(92,192,148,.35);
  --panel-grad:linear-gradient(180deg,#10301f 0%,#0c241a 100%);
  --display:'Cinzel','Trajan Pro',Georgia,serif;--body:'Cormorant Garamond',Garamond,'Times New Roman',serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%}
body{margin:0;background:var(--g0);background-image:var(--grad);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;font-weight:500}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ornaments */
.orn{display:flex;align-items:center;gap:12px;justify-content:center;color:currentColor;opacity:.75;margin:14px auto}
.orn::before,.orn::after{content:"";height:1px;background:currentColor;flex:1;max-width:120px;opacity:.6}
.orn span{font-size:12px;letter-spacing:.1em}

/* top bar */
.topbar{color:#fff;padding:14px 20px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,rgba(10,38,23,.55) 0%,rgba(10,38,23,.35) 60%,rgba(10,38,23,0) 100%);backdrop-filter:blur(4px)}
.topbar .mark{width:34px;height:34px;flex:none}
.topbar .name{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.22em;text-transform:uppercase}
.topbar .sub{display:none}
.topbar.hidden{display:none}

/* layout */
.wrap{max-width:1060px;margin:0 auto;padding:12px 16px 56px;display:grid;grid-template-columns:230px 1fr;gap:28px}
@media (max-width:760px){.wrap{grid-template-columns:1fr;padding-top:8px}}
.side{align-self:start;position:sticky;top:92px;color:#fff}
@media (max-width:760px){.side{position:static}}
.side .pct{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:8px}
.bar{height:3px;background:rgba(255,255,255,.18);overflow:hidden;margin-bottom:18px;position:relative}
.bar>div{height:100%;background:#fff;width:0;transition:width .25s}
.side ol{list-style:none;margin:0;padding:0;font-size:17px;counter-reset:sec}
.side li{padding:6px 0 6px 34px;position:relative;opacity:.5;counter-increment:sec}
.side li::before{content:counter(sec,upper-roman);position:absolute;left:0;top:7px;font-family:var(--display);font-size:11px;letter-spacing:.05em;width:26px;text-align:right;opacity:.9}
.side li.done{opacity:.85;cursor:pointer}
.side li.done:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.side li.now{opacity:1;font-weight:600}

@media (max-width:760px){.side ol{display:none}}
.side .savenote{font-size:16px;opacity:.8;margin-top:18px;line-height:1.4;font-style:italic}

/* card, styled as a document */
.card{background:var(--panel-grad);color:var(--ink);padding:34px 40px 24px;min-height:400px;display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px var(--paper-edge),0 0 0 5px var(--panel),0 0 0 6px var(--paper-edge),0 24px 60px rgba(0,0,0,.5)}
@media (max-width:560px){.card{padding:24px 20px 18px;box-shadow:0 0 0 1px var(--paper-edge),0 0 0 3px var(--panel),0 0 0 4px var(--paper-edge),0 24px 60px rgba(0,0,0,.5)}}
.crumb{font-family:var(--display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.q{font-family:var(--body);font-size:30px;font-weight:600;line-height:1.2;margin:0 0 8px;max-width:26em;letter-spacing:-.005em}
.help{color:var(--muted);font-size:18px;margin:0 0 22px;max-width:62ch;font-style:italic}
.help p{margin:0 0 8px}
.req{color:var(--danger);font-weight:400}
.body{flex:1}
.err{color:var(--danger);font-size:17px;margin:10px 0 0;min-height:22px;font-style:italic}

/* inputs */
.opts{display:flex;flex-direction:column;gap:6px;max-width:640px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--rule);padding:11px 16px;cursor:pointer;background:transparent;position:relative}
.opt:hover{border-color:var(--line)}
.opt.sel{border-color:var(--line);background:var(--tint);box-shadow:inset 0 0 0 1px var(--line)}
.opt.lock{background:var(--lock);cursor:default;color:var(--muted);border-style:dashed}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt>span:first-of-type{flex:1}
.opt::before{content:"◇";font-size:14px;line-height:1.4;color:var(--line);flex:none;width:16px}
.opt.sel::before{content:"◆"}
.opt.lock::before{content:"✓"}
.opt .lbl{font-weight:600;font-size:18px}
.opt .sub{display:block;font-size:17px;color:var(--muted);font-weight:500;font-style:italic;margin-top:2px}
.opt .tag{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:auto;white-space:nowrap;padding-top:5px}
input[type=text],textarea,select{width:100%;max-width:640px;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:0}
input[type=text]{border-width:0 0 1px;padding-left:2px;background:transparent}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--line);outline:none;box-shadow:0 1px 0 var(--line)}
textarea{min-height:130px;resize:vertical;line-height:1.5}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--line) 50%),linear-gradient(135deg,var(--line) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;max-width:640px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.field label{display:block;font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.count{font-size:17px;color:var(--muted);margin:10px 0;font-style:italic}
.search{margin-bottom:10px}
.mlist{max-height:340px;overflow:auto;border:1px solid var(--rule);max-width:640px}
.mlist .opt{border:0;border-bottom:1px solid var(--line-soft);box-shadow:none}
.mlist .opt.sel{box-shadow:inset 3px 0 0 var(--line)}
.mlist .opt:last-child{border-bottom:0}
.rank{list-style:none;margin:0;padding:0;max-width:640px;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:14px;border:1px solid var(--rule);padding:10px 14px}
.rank .n{font-family:var(--display);font-size:14px;font-weight:600;width:24px;color:var(--line);text-align:center;flex:none}
.rank .lbl{flex:1;font-weight:600}
.rank .lbl small{display:block;color:var(--muted);font-weight:500;font-style:italic;font-size:17px}
.rank .mv{display:flex;gap:4px}
.rank .mv button{border:1px solid var(--rule);background:transparent;width:32px;height:32px;cursor:pointer;color:var(--line)}
.rank .mv button:hover:not(:disabled){border-color:var(--line);background:var(--tint)}
.rank .mv button:disabled{opacity:.3;cursor:default}
.rank .pts{font-family:var(--display);font-weight:600;width:30px;text-align:right;color:var(--ink);font-size:15px}

/* buttons */
.btn{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--line);padding:12px 26px;cursor:pointer;position:relative;box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line)}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--btn-grad);color:#fff;border-color:var(--g2)}
.btn.primary:hover{background:linear-gradient(180deg,var(--g4),var(--g3))}
.btn.link{border:0;box-shadow:none;background:none;color:var(--link);padding:12px 6px;letter-spacing:.12em}
.btn.link:hover{text-decoration:underline;text-underline-offset:4px}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;gap:16px;align-items:center;border-top:1px solid var(--rule);padding-top:20px;margin-top:22px;flex-wrap:wrap}
.nav .sp{flex:1}
.saved{font-size:15px;color:var(--muted);font-style:italic}
.saved.ok{color:var(--ok)}

/* landing */
.portal{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px 40px;color:#fff;text-align:center}
.portal .sigil{width:140px;height:140px;margin:0 auto 18px;color:#fff;filter:drop-shadow(0 6px 30px rgba(92,192,148,.35))}
@media (max-width:560px){.portal .sigil{width:120px;height:120px}}
.portal .wordmark{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.28em;text-transform:uppercase;line-height:1.3;margin:0 auto}
.portal .wordmark small{display:block;font-size:11px;letter-spacing:.32em;opacity:.8;margin-top:6px;font-weight:400}
@media (max-width:560px){.portal .wordmark{font-size:16px;letter-spacing:.2em}}
.portal h1{font-family:var(--body);font-weight:600;font-size:34px;line-height:1.15;margin:8px auto 18px;max-width:20em}
@media (max-width:560px){.portal h1{font-size:27px}}
.portal .intro{max-width:58ch;margin:0 auto;font-size:19px;line-height:1.6;color:rgba(255,255,255,.88)}
.portal .intro p{margin:0 0 14px}
.portal .cta{margin:24px 0 8px;display:flex;flex-direction:column;align-items:center;gap:16px}
.portal .btn{box-shadow:0 0 0 3px rgba(20,65,41,.9),0 0 0 4px rgba(255,255,255,.7);border-color:#fff;color:#fff;font-size:13px;padding:15px 38px}
.portal .btn.primary{background:#fff;color:var(--g1);border-color:#fff}
.portal .btn.primary:hover{background:#eaf3ec}
.portal .btn.ghost:hover{background:rgba(255,255,255,.1)}
.portal .small{color:rgba(255,255,255,.8);font-size:17px;font-style:italic}
.portal .resume{margin-top:16px;width:100%;max-width:460px}
.portal .resume label{color:rgba(255,255,255,.7);font-size:15px;display:block;margin-bottom:6px;font-style:italic}
.portal .resume .row{display:flex;gap:8px;align-items:flex-end}
.portal .resume input[type=text]{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.portal .resume input::placeholder{color:rgba(255,255,255,.45)}
.portal .resume .btn{box-shadow:none;padding:9px 16px;font-size:11px}
.portal .resume .err{color:#ffb4ad}
.portal .foot{margin-top:36px;font-size:14px;color:rgba(255,255,255,.55);font-style:italic}


/* cinematic intro */
.portal .brand{display:flex;flex-direction:column;align-items:center}
.portal.cine .brand{opacity:0;transform:translateY(var(--dy,0px)) scale(1.15);animation:brandIn 1.3s ease-out .2s forwards,brandUp 1s cubic-bezier(.65,0,.25,1) 1.9s forwards}
.portal.cine .glow{position:fixed;left:50%;top:50%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(92,192,148,.35) 0%,rgba(92,192,148,0) 65%);pointer-events:none;opacity:0;animation:glowIn 1.3s ease-out .2s forwards,glowOut 1s ease-in 1.9s forwards}
.portal.cine .rv{opacity:0;transform:translateY(14px);animation:reveal .9s ease-out forwards}
.portal.cine .orn{animation-delay:2.8s}
.portal.cine h1.rv{animation-delay:3.05s}
.portal.cine .intro p:nth-child(1){animation-delay:4.4s}
.portal.cine .intro p:nth-child(2){animation-delay:4.7s}
.portal.cine .intro p:nth-child(3){animation-delay:5s}
.portal.cine .cta{animation-delay:5.5s}
.portal.cine .foot{animation-delay:6s}
@keyframes brandIn{0%{opacity:0;transform:translateY(var(--dy,0px)) scale(1.15)}100%{opacity:1;transform:translateY(var(--dy,0px)) scale(1.1)}}
@keyframes brandUp{0%{opacity:1;transform:translateY(var(--dy,0px)) scale(1.1)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glowIn{to{opacity:1}}
@keyframes glowOut{to{opacity:0}}
@keyframes reveal{to{opacity:1;transform:none}}
.portal .skip{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;font-family:var(--display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);background:none;border:1px solid rgba(255,255,255,.25);padding:8px 14px;cursor:pointer}
.portal .skip:hover{color:#fff;border-color:#fff}
@media (prefers-reduced-motion:reduce){.portal.cine .brand,.portal.cine .rv{animation:none;opacity:1;transform:none}.portal.cine .glow,.portal .skip{display:none}}



/* landing: posting */
.portal{justify-content:flex-start;padding-top:56px}
.portal .lead{max-width:52ch;margin:0 auto;font-size:20px;line-height:1.55;color:rgba(255,255,255,.9);font-style:italic}
.portal .cta{margin:22px 0 30px}
.portal .posting{background:var(--panel-grad);color:var(--ink);text-align:left;max-width:720px;width:100%;margin:0 auto;padding:36px 44px 32px;box-shadow:0 0 0 1px var(--paper-edge),0 0 0 5px var(--panel),0 0 0 6px var(--paper-edge),0 24px 60px rgba(0,0,0,.5);position:relative}
@media (max-width:560px){.portal .posting{padding:26px 22px 24px;box-shadow:0 0 0 1px var(--paper-edge),0 0 0 3px var(--panel),0 0 0 4px var(--paper-edge),0 24px 60px rgba(0,0,0,.5)}}
.portal .posting header{text-align:center;border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:20px}
.portal .posting h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px}
.portal .posting .sub{font-size:17px;color:var(--muted);font-style:italic;margin:0}
.portal .posting p{font-size:18px;line-height:1.55;margin:0 0 14px}
.portal .posting h3{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
.portal .posting ul{margin:0 0 14px;padding:0;list-style:none}
.portal .posting li{font-size:18px;line-height:1.5;padding:4px 0 4px 22px;position:relative}
.portal .posting li::before{content:"◆";position:absolute;left:0;top:7px;font-size:9px;color:var(--line)}
.portal .posting .fine{font-size:16px;color:var(--muted);font-style:italic;border-top:1px solid var(--line-soft);padding-top:14px;margin-top:20px}
.portal .posting .cta2{text-align:center;margin-top:24px}
.portal .posting .btn{box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line);border-color:var(--g2);color:#fff;background:var(--btn-grad)}
.portal .posting .btn:hover{background:linear-gradient(180deg,var(--g4),var(--g3))}
.portal .foot{margin-top:28px;font-size:16px;color:rgba(255,255,255,.7)}
.portal .lookup{margin:34px auto 0;width:100%;max-width:460px;text-align:center}
.portal .lookup label{color:rgba(255,255,255,.7);font-size:15px;display:block;margin-bottom:8px;font-style:italic}
.portal .lookup .row{display:flex;gap:10px;align-items:stretch}
.portal .lookup input[type=text]{background:transparent;border:1px solid rgba(255,255,255,.45);border-width:1px;color:#fff;font-family:var(--display);letter-spacing:.18em;text-transform:uppercase;font-size:15px;padding:10px 14px;text-align:center}
.portal .lookup input::placeholder{color:rgba(255,255,255,.4);letter-spacing:.1em;font-family:var(--body);text-transform:none;font-size:15px}
.portal .lookup .btn{box-shadow:none;padding:9px 16px;font-size:11px}
.portal .lookup .err{color:#ffb4ad;font-size:14px;margin-top:6px;text-align:center}
.portal.cine .lookup.rv{animation-delay:4.9s}
.portal.cine .lead.rv{animation-delay:4.4s}
.portal.cine .cta.rv{animation-delay:4.8s}
.portal.cine .posting.rv{animation-delay:5.2s}
.portal.cine .foot.rv{animation-delay:5.6s}


/* posting emphasis */
.portal .sigil{width:110px;height:110px;margin-bottom:12px}
.portal .wordmark{font-size:18px}
.portal h1{font-size:30px;margin-top:6px}
.portal .lead{margin-bottom:26px}
.portal .posting{max-width:760px;padding:40px 52px 36px}
@media (max-width:560px){.portal .posting{padding:26px 22px 24px}}
.portal .posting p,.portal .posting li{font-size:19px;line-height:1.6}
.portal .posting h3{font-size:12px;margin-top:28px}
.portal .posting li{padding:6px 0 6px 24px}
.portal .posting .ack{border-top:1px solid var(--rule);margin-top:26px;padding-top:22px}
.portal .posting .ackbox{display:flex;gap:14px;align-items:flex-start;cursor:pointer;font-size:17px;line-height:1.5;margin-bottom:22px}
.portal .posting .ackbox input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border:1px solid var(--line);margin-top:3px;cursor:pointer;display:grid;place-items:center;background:var(--panel)}
.portal .posting .ackbox input:checked{background:var(--line);border-color:var(--line)}
.portal .posting .ackbox input:checked::before{content:"✓";color:#fff;font-size:14px;line-height:1}
.portal .posting .ackbox input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.portal .posting .cta2{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.portal .posting .btn.primary:disabled{opacity:.35}
.portal .posting .btn:not(.primary){background:transparent;color:var(--line);border-color:var(--line);box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line)}
.portal .posting .btn:not(.primary):hover{background:var(--tint)}
.portal .posting .small{color:var(--muted)}
.portal.cine .lead.rv{animation-delay:3.3s}
.portal.cine .posting.rv{animation-delay:3.6s}
.portal.cine .foot.rv{animation-delay:4s}


/* responsive fixes */
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:16px}.side{position:static}.side ol{display:none}.side .savenote{display:none}.side .bar{margin-bottom:6px}}
@media (max-width:760px){.portal .posting{padding:30px 28px 28px}.portal h1{font-size:26px}.portal .lead{font-size:17px}}
@media (max-width:560px){.portal{padding:36px 12px 28px}.portal .posting{padding:24px 18px 22px;max-width:100%}.portal .posting p,.portal .posting li{font-size:17px}.portal .posting .ackbox{font-size:15px}.portal .posting .cta2{flex-direction:column}.q{font-size:25px}.card{padding:22px 16px 16px}.opt{flex-wrap:wrap}.opt .tag{margin-left:32px;padding-top:0}.nav{gap:10px}.btn{padding:11px 18px;font-size:11px}.portal .skip{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
@media (max-width:400px){.portal .wordmark{font-size:14px;letter-spacing:.16em}.abil{grid-template-columns:repeat(2,1fr)}}


/* game feel */
.card.enter-fwd{animation:cardFwd .32s cubic-bezier(.2,.7,.2,1)}
.card.enter-back{animation:cardBack .32s cubic-bezier(.2,.7,.2,1)}
@keyframes cardFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes cardBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.card.title{justify-content:center;align-items:center;text-align:center;min-height:420px}
.card.title .tnum{font-family:var(--display);font-size:56px;line-height:1;color:var(--line);opacity:.5;margin-bottom:10px}
.card.title .q{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.card.title .help{max-width:52ch;margin-bottom:8px}
.card.title .body{flex:0}
.card.title .nav{width:100%;justify-content:center}
.card.title .nav .sp{display:none}
.crumb{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crumb .dots{display:inline-flex;gap:5px}
.crumb .dots i{width:6px;height:6px;border:1px solid var(--line);display:block;transform:rotate(45deg);opacity:.35}
.crumb .dots i.d{background:var(--line);opacity:.7}
.crumb .dots i.c{background:var(--line);opacity:1;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
kbd{font-family:var(--display);font-size:9px;letter-spacing:.05em;border:1px solid currentColor;padding:1px 5px;opacity:.45;line-height:1.4;margin-left:8px;vertical-align:middle}
.opt kbd{flex:none;align-self:center;color:var(--muted)}
.opt.sel kbd{opacity:.8;color:var(--line)}
.btn.primary kbd{border-color:rgba(255,255,255,.6);color:#fff;opacity:.7}
@media (hover:none){kbd{display:none}}
.rank .pts{width:auto;min-width:110px;display:grid;grid-template-columns:auto auto auto;gap:0 8px;align-items:baseline;justify-content:end;text-align:right;color:var(--muted);font-family:var(--body);font-size:17px;font-weight:500}
.rank .pts .base{grid-column:1;text-decoration:line-through;opacity:.7}
.rank .pts b{grid-column:2;color:var(--g5);font-weight:600}
.rank .pts em{font-style:normal;color:var(--ink);font-weight:600;font-size:24px;grid-column:3}
.rank .pts small{grid-column:1/-1;font-size:15px;color:var(--muted);font-weight:500;letter-spacing:0}
.prev{margin-top:18px;border-top:1px solid rgba(255,255,255,.2);padding-top:12px;font-size:15px}
.prev .pt{font-family:var(--display);font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
.prev div span{display:block;font-size:12px;opacity:.6;font-style:italic}
.prev>div:not(.pt){margin-bottom:6px}
@media (max-width:900px){.prev{display:none}}


/* acceptance letter + badge */
.lhead{text-align:center;border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:22px}
.lsig{width:56px;height:56px;color:#fff;margin-bottom:8px}
.lco{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.24em;text-transform:uppercase}
.ldept{font-size:15px;color:var(--muted);font-style:italic;margin-top:4px}
.lbody p{font-size:18px;line-height:1.6;margin:0 0 14px}
.lsign{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.badgewrap{display:flex;justify-content:center;margin:28px 0 14px}
.badge{width:320px;height:508px;max-width:100%;background:linear-gradient(180deg,#fbf9f3,#f1ece0);color:#12261c;border-radius:12px;text-align:center;box-shadow:0 0 0 2px #1b6d4e,0 0 0 5px #f8f5ec,0 0 0 6px rgba(27,109,78,.45),0 20px 50px rgba(0,0,0,.5);position:relative;overflow:hidden;overflow-wrap:anywhere;font-family:var(--body)}
.badge .bhead{height:84px;background:linear-gradient(180deg,#1f5c3c,#12503a);color:#fff;position:relative}
.badge .bbrand{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;justify-content:center;gap:12px}
.badge .bbrand svg{width:50px;height:50px;color:#fff;flex:none}
.badge .bco{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-align:left;line-height:18px}
.badge .bphoto{position:absolute;top:96px;left:50%;transform:translateX(-50%);width:96px;height:112px;border:1px solid #1b6d4e;border-radius:6px;background:#fff}
.badge .bhint{position:absolute;top:214px;left:0;right:0;font-size:12px;font-style:italic;color:#4e6457;line-height:1}
.badge .bname{position:absolute;top:236px;left:16px;right:16px;font-size:24px;font-weight:600;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge .brole{position:absolute;top:266px;left:0;right:0;font-style:italic;font-size:14px;color:#4e6457;line-height:1}
.badge .bdept{position:absolute;top:288px;left:16px;right:16px;font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#1b6d4e;line-height:1;white-space:nowrap;overflow:hidden}
.badge .bstrip{position:absolute;top:312px;left:16px;right:16px;border-top:1px solid rgba(27,109,78,.45);display:grid;grid-template-columns:1fr 1fr 1fr;padding-top:10px}
.badge .bstrip span{display:block;font-family:var(--display);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#4e6457;line-height:1;margin-bottom:5px}
.badge .bstrip b{display:block;font-size:14px;font-weight:600;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge .bbar{position:absolute;top:362px;left:0;right:0;display:flex;justify-content:center;height:30px}
.badge .bbar svg{height:30px;max-width:90%}
.badge .bnum{position:absolute;top:396px;left:0;right:0;font-size:11px;color:#4e6457;line-height:1}
.badge .bfoot{position:absolute;top:420px;left:20px;right:20px;font-size:12px;font-style:italic;color:#4e6457;line-height:15px}
/* spinner + centered card */
.card.center{align-items:center;justify-content:center;text-align:center;min-height:300px}
.spinner{width:44px;height:44px;border:2px solid rgba(92,192,148,.25);border-top-color:var(--g5);border-radius:50%;animation:spin .9s linear infinite;margin-bottom:18px}
@keyframes spin{to{transform:rotate(360deg)}}
.rank li{position:relative;will-change:transform}
.rank li.moving{z-index:2}
.rank li.flash{background:var(--tint);border-color:var(--line);transition:background .4s,border-color .4s}
.letter .lbody{text-align:left}
.donewrap{max-width:740px;margin:0 auto;padding:12px 16px 56px}
.donewrap .card{min-height:0}

/* posting: light paper */
.portal .posting{--panel:#f8f5ec;--panel2:#f1ece0;--ink:#12261c;--muted:#3a5245;--line:#1b6d4e;--line-soft:#cfd9cf;--rule:#9fbcab;--tint:#e4efe6;--focus:#5cc094;--paper-edge:rgba(27,109,78,.35);background:linear-gradient(180deg,#faf8f1 0%,#f3eee2 100%);color:var(--ink);box-shadow:0 0 0 1px var(--paper-edge),0 0 0 5px #f8f5ec,0 0 0 6px var(--paper-edge),0 24px 60px rgba(0,0,0,.5)}
@media (max-width:560px){.portal .posting{box-shadow:0 0 0 1px var(--paper-edge),0 0 0 3px #f8f5ec,0 0 0 4px var(--paper-edge),0 24px 60px rgba(0,0,0,.5)}}
.portal .posting .btn.primary{box-shadow:0 0 0 3px #f8f5ec,0 0 0 4px var(--line)}
.portal .posting .btn:not(.primary){box-shadow:0 0 0 3px #f8f5ec,0 0 0 4px var(--line)}
.portal .posting .ackbox input{background:#f8f5ec}
/* ornament rule */
.orn{gap:14px}
.orn::before,.orn::after{max-width:150px}
.orn span{font-size:10px;line-height:1;opacity:.9}

/* review */
.rev h3{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule);color:var(--muted)}
.rev .row{display:grid;grid-template-columns:1fr 2fr auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:17px}
@media (max-width:560px){.rev .row{grid-template-columns:1fr;gap:2px}}
.rev .k{color:var(--muted);font-style:italic}
.rev .v{white-space:pre-wrap}
.rev .e{color:var(--link);background:none;border:0;cursor:pointer;padding:0;font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.small{font-size:17px;color:var(--muted);font-style:italic}

/* offer letter / sheet */
.letter{max-width:780px;margin:0 auto}
.letter .card{min-height:0}
.letter h1{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;text-align:center}
.letter .meta{color:var(--muted);font-size:17px;margin-bottom:22px;text-align:center;font-style:italic}
.sheet{border:1px solid var(--rule);padding:22px 24px;margin-top:22px;box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--rule)}
.sheet h2{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 14px;color:var(--muted)}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 16px}
@media (max-width:560px){.abil{grid-template-columns:repeat(3,1fr)}}
.abil div{background:var(--btn-grad);color:#fff;text-align:center;padding:10px 4px;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.abil .a{font-family:var(--display);font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.abil .m{font-size:28px;font-weight:600;line-height:1.1}
.abil .s{font-size:13px;opacity:.85;font-style:italic}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0 0 16px}
.stats div{border:1px solid var(--rule);padding:8px 10px}
.stats .a{font-family:var(--display);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats .m{font-size:22px;font-weight:600}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;font-size:17px;margin:0 0 12px}
@media (max-width:560px){.kv{grid-template-columns:1fr}}
.kv dt{color:var(--muted);font-style:italic}
.kv dd{margin:0}
.hr{border-top:1px solid var(--rule);margin:20px 0;position:relative;text-align:center}
.hrnotes{font-size:17px}
.hrnotes p{margin:0 0 8px}
.hrnotes .k{color:var(--muted);font-style:italic}
pre.code{background:var(--lock);border:1px solid var(--rule);padding:10px;font-size:12px;overflow:auto;max-height:180px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}

/* modal */
.modal{position:fixed;inset:0;background:rgba(3,18,12,.75);display:none;place-items:center;padding:16px;z-index:10}
.modal.open{display:grid}
.modal .box{background:var(--panel-grad);color:var(--ink);padding:26px;max-width:540px;width:100%;box-shadow:0 0 0 1px var(--paper-edge),0 0 0 5px var(--panel),0 0 0 6px var(--paper-edge)}
.modal h2{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 8px}
.modal .row{display:flex;gap:14px;margin:12px 0;align-items:center;flex-wrap:wrap}
</style>

const ABIL=['Str','Dex','Con','Int','Wis','Cha'];
const ABIL_FULL={Str:'Strength',Dex:'Dexterity',Con:'Constitution',Int:'Intelligence',Wis:'Wisdom',Cha:'Charisma'};

function chosenSkills(a){const b=bg(a);const out=[...(b?b.sk:[]),...(a.skills||[])];return out}
function allSkills(a,skip=[]){const out=chosenSkills(a);if(a.elf_skill)out.push(a.elf_skill);if(a.human_skill)out.push(a.human_skill);if(!skip.includes('skilled'))(a.skilled||[]).forEach(s=>out.push(s));return [...new Set(out)]}
function skilledCount(a){return ((bg(a)&&bg(a).feat==='Skilled')?1:0)+(a.human_feat==='Skilled'?1:0)}
function miClass(a){const b=bg(a);const f=[b&&b.feat,a.human_feat].find(x=>MI_CLASS[x]);return f?MI_CLASS[f]:null}
function bgFeats(a){const b=bg(a);const out=[];if(b)out.push(b.feat);if(a.human_feat)out.push(a.human_feat);return out}
function weaponsFor(a){const c=cls(a);if(!c)return[];return WEAPONS.filter(w=>c.wp==='m'||w[2]==='s'||(c.wp==='r'&&w[3]==='fl')||(c.wp==='k'&&LIGHT_WEAPONS.includes(w[0]))).map(w=>({v:w[0],l:w[0],tag:w[1]}))}
function cantripCount(a){const c=cls(a);if(!c||!c.cast)return 0;let n=c.cast.cant;if((a.class==='Cleric'&&a.order==='Thaumaturge')||(a.class==='Druid'&&a.porder==='Magician'))n++;return n}

function drawLogoPath(g,d){const t=d.match(/[MCZ]|-?\d*\.?\d+/g);let i=0;g.beginPath();while(i<t.length){const c=t[i++];if(c==='M'){g.moveTo(+t[i++],+t[i++])}else if(c==='C'){g.bezierCurveTo(+t[i++],+t[i++],+t[i++],+t[i++],+t[i++],+t[i++])}else if(c==='Z'){g.closePath()}}g.fill()}

const KEY='beastward.application.v1';
let introPlayed=false;let dir='fwd';let autoTimer=null;
let S={answers:{},step:0,view:'landing',submitted:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(x,a)=>typeof x==='function'?x(a):x;
const opt=o=>typeof o==='string'?{v:o,l:o}:o;
const mod=n=>Math.floor((n-10)/2);
const sign=n=>(n>=0?'+':'')+n;

// ---------- persistence
function save(){try{localStorage.setItem(KEY,JSON.stringify({answers:S.answers,step:S.step,submitted:S.submitted,t:Date.now()}))}catch(e){}
  const el=$('#savedmsg');if(el){el.textContent='Saved';el.classList.add('ok')}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}

// ---------- steps
function steps(){const a=S.answers;return QUESTIONS.filter(q=>!q.show||q.show(a))}
function stepCount(){return steps().length}
function current(){return steps()[S.step]}

const DEPS={class:['fstyle','expertise','order','porder','invocation','mastery','cantrips','spells','skills','class_kit'],background:['bonus','skills','expertise','skilled','mi_cantrips','mi_spell'],order:['cantrips'],porder:['cantrips'],skills:['expertise','skilled','human_skill'],species:['lineage','lineage_cantrip','elf_skill','human_feat','human_skill','skilled','mi_cantrips','mi_spell'],human_feat:['skilled','mi_cantrips','mi_spell'],lineage:['lineage_cantrip']};
function setAnswer(id,v){
  const prev=S.answers[id];
  S.answers[id]=v;
  if(DEPS[id]&&JSON.stringify(prev)!==JSON.stringify(v))DEPS[id].forEach(k=>delete S.answers[k]);
  save();
}

function valid(q){
  const a=S.answers,v=a[q.id];
  if(!q.req)return null;
  switch(q.type){
    case 'text':if(!v||!String(v).trim())return 'This field is required.';break;
    case 'fields':{const f=q.fields[0][0];if(!v||!v[f]||!String(v[f]).trim())return 'Please complete at least the first field.';break}
    case 'choice':if(!v)return 'Please select an option.';if(q.follow&&q.follow.when(v)&&!(a[q.follow.id]||'').trim())return 'Please complete the follow-up field.';break;
    case 'checkbox':case 'multiselect':{const n=(v||[]).length,mn=val(q.min,a)||0,mx=val(q.max,a);if(n<mn)return `Select ${mn===mx?mn:'at least '+mn}.`;if(mx&&n>mx)return `Select no more than ${mx}.`;break}
    case 'abilpick':if(!v||!v.p||!v.s)return 'Please confirm both a primary and a secondary strength.';if(v.p===v.s)return 'Primary and secondary must differ.';break;
    case 'ranking':if(!v||v.length!==6)return 'Please rank all six.';break;
  }
  return null;
}

// ---------- render
function render(){
  const app=$('#app');
  $('#topbar').classList.toggle('hidden',S.view==='landing');
  try{window.scrollTo({top:0})}catch(e){}
  if(S.view==='landing')return app.innerHTML=landing();
  if(S.view==='reviewing')return app.innerHTML=reviewing();
  if(S.view==='fetching')return app.innerHTML=`<div class="donewrap"><section class="card center"><div class="spinner"></div><p class="small">Retrieving personnel file…</p></section></div>`;
  if(S.view==='dm'){app.innerHTML=dmView();bindDm();return}
  if(S.view==='done')return app.innerHTML=offer();
  const list=steps();if(S.step>=list.length)S.step=list.length-1;
  const q=list[S.step],a=S.answers;
  const pct=Math.round(100*S.step/(list.length-1));
  const secDone=i=>list.findIndex(x=>x.s===i)<S.step;
  const inSec=list.filter(x=>x.s===q.s),secIdx=inSec.indexOf(q);
  const isTitle=q.type==='info'&&q.id.startsWith('intro_');
  const roman=['I','II','III','IV','V','VI','VII','VIII'];
  const canRoll=['choice','checkbox','multiselect','ranking'].includes(q.type);
  app.innerHTML=`<div class="wrap">
    <aside class="side">
      <div class="pct">Application ${pct}% complete</div><div class="bar"><div style="width:${pct}%"></div></div>
      <ol>${SECTIONS.map((s,i)=>`<li class="${q.s===i?'now':secDone(i)?'done':''}" data-sec="${i}">${s}</li>`).join('')}</ol>
      ${preview(a)}
      <div class="savenote">Progress is saved as you go.</div>
    </aside>
    <section class="card ${dir==='back'?'enter-back':'enter-fwd'} ${isTitle?'title':''}" aria-live="polite">
      ${isTitle?`<div class="tnum">${roman[q.s]}</div><h1 class="q">${SECTIONS[q.s]}</h1>${q.help?`<div class="help">${val(q.help,a)}</div>`:''}`:`
      <div class="crumb"><span>${roman[q.s]} · ${SECTIONS[q.s]}</span><span class="dots">${inSec.map((x,i)=>`<i class="${i<secIdx?'d':i===secIdx?'c':''}"></i>`).join('')}</span></div>
      <h1 class="q">${val(q.prompt,a)}${q.req?' <span class="req">*</span>':''}</h1>
      ${q.help?`<div class="help">${q.type==='info'?val(q.help,a):'<p>'+esc(val(q.help,a))+'</p>'}</div>`:''}`}
      <div class="body" id="body">${body(q)}</div>
      <div class="err" id="err"></div>
      <div class="nav">
        <button class="btn" id="back" ${S.step===0?'disabled':''}>Back</button>
        <button class="btn link" id="saveexit">Save and exit</button>
        ${canRoll?`<button class="btn link" id="roll" title="Choose at random">Roll for me</button>`:''}
        <span class="sp"></span><span class="saved" id="savedmsg"></span>
        ${q.type==='review'?`<button class="btn primary" id="submit">Submit application</button>`:`<button class="btn primary" id="next">${S.step===list.length-1?'Finish':isTitle?'Begin':'Next'}</button>`}
      </div>
    </section></div>`;
  bind(q);
}
function preview(a){
  const rows=[['Name',a.name],['Species',a.species],['Previous role',bg(a)?bg(a).n:''],['Department',cls(a)?cls(a).dept:'']].filter(r=>r[1]);
  if(!rows.length)return '';
  return `<div class="prev"><div class="pt">Applicant file</div>${rows.map(([k,v])=>`<div><span>${k}</span>${esc(v)}</div>`).join('')}</div>`;
}
function questionNumber(q){const l=steps().filter(x=>x.type!=='info'&&x.type!=='review');return l.indexOf(q)+1}

function body(q){
  const a=S.answers,v=a[q.id];
  switch(q.type){
    case 'info':return '';
    case 'text':return q.multiline?`<textarea id="in" >${esc(v||'')}</textarea>`:`<input type="text" id="in" value="${esc(v||'')}" autocomplete="off">`;
    case 'fields':return `<div class="grid2">${q.fields.map(([k,l])=>`<div class="field"><label for="f_${k}">${l}</label><input type="text" id="f_${k}" data-f="${k}" value="${esc((v||{})[k]||'')}" autocomplete="off"></div>`).join('')}</div>`;
    case 'choice':{
      const opts=val(q.options,a).map(opt);
      let h;
      if(q.render==='dropdown'){h=`<select id="in"><option value="">Select one</option>${opts.map(o=>`<option value="${esc(o.v)}" ${v===o.v?'selected':''}>${esc(o.l)}${o.sub?' ('+esc(o.sub)+')':''}</option>`).join('')}</select>`}
      else h=`<div class="opts">${opts.map((o,i)=>`<label class="opt ${v===o.v?'sel':''}"><input type="radio" name="c" value="${esc(o.v)}" ${v===o.v?'checked':''}><span><span class="lbl">${esc(o.l)}</span>${o.sub?`<span class="sub">${esc(o.sub)}</span>`:''}</span>${o.tag?`<span class="tag">${esc(o.tag)}</span>`:''}</label>`).join('')}</div>`;
      if(q.follow&&v&&q.follow.when(v))h+=`<div class="field" style="margin-top:14px;max-width:640px"><label for="fu">${q.follow.prompt}</label>${q.follow.multiline?`<textarea id="fu">${esc(a[q.follow.id]||'')}</textarea>`:`<input type="text" id="fu" value="${esc(a[q.follow.id]||'')}">`}</div>`;
      return h;
    }
    case 'checkbox':{
      const opts=val(q.options,a).map(opt),sel=v||[],locked=q.locked?val(q.locked,a):[];
      const mx=val(q.max,a);

        ${opts.map((o,i)=>`<label class="opt ${sel.includes(o.v)?'sel':''}"><input type="checkbox" value="${esc(o.v)}" ${sel.includes(o.v)?'checked':''}><span><span class="lbl">${esc(o.l)}</span>${o.sub?`<span class="sub">${esc(o.sub)}</span>`:''}</span>${o.tag?`<span class="tag">${esc(o.tag)}</span>`:''}</label>`).join('')}</div>
        ${mx?`<div class="count" id="count">${sel.length} of ${mx} selected</div>`:''}`;
    }
    case 'multiselect':{
      const opts=val(q.options,a).map(opt),sel=v||[],mx=val(q.max,a);
      return `<input type="text" class="search" id="search" placeholder="Filter list" autocomplete="off"><div class="mlist" id="mlist">${opts.map(o=>`<label class="opt ${sel.includes(o.v)?'sel':''}" data-l="${esc(o.l.toLowerCase())}"><input type="checkbox" value="${esc(o.v)}" ${sel.includes(o.v)?'checked':''}><span class="lbl">${esc(o.l)}</span></label>`).join('')}</div><div class="count" id="count">${sel.length} of ${mx} selected</div>`;
    }

      return `<div class="grid2"><div class="field"><label>Primary strength (+2)</label>${sel('ab_p',p,s)}</div><div class="field"><label>Secondary strength (+1)</label>${sel('ab_s',s,p)}</div></div>`;
    }
    case 'ranking':{
      const order=v||[...ABIL];const bn=a.bonus||{};
      return `<ol class="rank" id="rank">${order.map((x,i)=>{const add=bn.p===x?2:bn.s===x?1:0;return `<li data-k="${x}"><span class="n">${i+1}</span><span class="lbl">${ABIL_JOB[x]}<small>${ABIL_FULL[x]}</small></span><span class="pts">${add?`<span class="base">${ARRAY[i]}</span><b>+${add}</b>`:''}<em>${ARRAY[i]+add}</em><small>${sign(mod(ARRAY[i]+add))}</small></span><span class="mv"><button data-mv="-1" ${i===0?'disabled':''} aria-label="Move up">↑</button><button data-mv="1" ${i===5?'disabled':''} aria-label="Move down">↓</button></span></li>`}).join('')}</ol>`;
    }
    case 'review':return review();
  }
}

function bind(q){

      ol.addEventListener('click',e=>{const btn=e.target.closest('[data-mv]');if(!btn||btn.disabled)return;const li=btn.closest('li');const order=[...a[q.id]];const i=order.indexOf(li.dataset.k),j=i+(+btn.dataset.mv);if(j<0||j>5)return;

function roll(q){
  const a=S.answers;const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
  if(q.type==='choice'){const o=val(q.options,a).map(opt);let c=pick(o);if(q.follow){const ok=o.filter(x=>!q.follow.when(x.v));if(ok.length)c=pick(ok)}setAnswer(q.id,c.v)}
  else if(q.type==='checkbox'||q.type==='multiselect'){const o=val(q.options,a).map(opt).map(x=>x.v);const mx=val(q.max,a)||Math.max(1,Math.ceil(o.length/3));const n=Math.min(mx,o.length);const pool=[...o],out=[];while(out.length<n)out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);setAnswer(q.id,out)}
  else if(q.type==='ranking'){const pool=[...ABIL],out=[];while(pool.length)out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);setAnswer(q.id,out)}
  dir='fwd';render();
}
function next(){

}
document.addEventListener('keydown',e=>{
  if(S.view!=='form')return;
  const typing=['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName)&&e.target.type!=='radio'&&e.target.type!=='checkbox';
  if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='BUTTON'){e.preventDefault();if($('#next'))next();return}

  if(/^[1-9]$/.test(e.key)){const inputs=[...document.querySelectorAll('#body .opt input:not(:disabled)')];const t=inputs[+e.key-1];if(t){t.checked=t.type==='radio'?true:!t.checked;t.dispatchEvent(new Event('change'));e.preventDefault()}return}
  if(e.key==='Escape'||(e.key==='Backspace'&&!typing)){const bk=$('#back');if(bk&&!bk.disabled){bk.click();e.preventDefault()}}

function display(q,v){
  if(v==null||v==='')return '';
  if(Array.isArray(v))return v.join(', ');
  if(q.type==='fields')return q.fields.map(([k,l])=>v[k]?`${l}: ${v[k]}`:'').filter(Boolean).join('\n');
  if(q.type==='abilpick')return `Primary: ${ABIL_FULL[v.p]||''}\nSecondary: ${ABIL_FULL[v.s]||''}`;
  if(q.type==='ranking')return v.map((x,i)=>`${i+1}. ${ABIL_JOB[x]}`).join('\n');
  if(q.type==='choice'){const o=val(q.options,S.answers).map(opt).find(o=>o.v===v);let s=o?o.l:v;if(q.follow&&q.follow.when(v)&&S.answers[q.follow.id])s+='\n'+S.answers[q.follow.id];return s}
  return String(v);
}

const BADGE_W=320,BADGE_H=508;
function badgeCtxHelpers(g,K,disp,body){
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  const trackW=(t,f,ls)=>{g.font=f;let w=0;for(const ch of t)w+=g.measureText(ch).width+ls;return w-ls};
  const sp=(t,x,y,f,ls,col)=>{g.font=f;g.fillStyle=col;g.textAlign='left';let cx=x;for(const ch of t){g.fillText(ch,cx,y);cx+=g.measureText(ch).width+ls}};
  const spC=(t,cx,y,f,ls,col,maxW)=>{let size=parseInt(f.match(/(\d+)px/)[1]);let ff=f;while(trackW(t,ff,ls)>maxW&&size>6){size--;ff=f.replace(/\d+px/,size+'px')}sp(t,cx-trackW(t,ff,ls)/2,y,ff,ls,col)};
  const fit=(t,f,maxW)=>{let size=parseInt(f.match(/(\d+)px/)[1]);let ff=f;g.font=ff;while(g.measureText(t).width>maxW&&size>8){size--;ff=f.replace(/\d+px/,size+'px');g.font=ff}return ff};
  const wrapLines=(t,f,maxW)=>{g.font=f;const words=t.split(' '),lines=[];let cur='';for(const w of words){const test=cur?cur+' '+w:w;if(g.measureText(test).width>maxW&&cur){lines.push(cur);cur=w}else cur=test}if(cur)lines.push(cur);return lines};
  const logo=(cx,cy,size,col)=>{g.save();const sc=size/452;g.translate(cx-size/2,cy-(370*sc)/2);g.scale(sc,sc);g.translate(0,-88);g.fillStyle=col;LOGO_PATHS.forEach(d=>drawLogoPath(g,d));g.restore()};
  return {rr,trackW,sp,spC,fit,wrapLines,logo};
}
function badgeCanvas(side,K,bleed){

    cols.forEach(([k,v],i)=>{const x=16+i*cw+cw/2;g.textAlign='center';spC(k.toUpperCase(),x,322,`600 9px ${disp}`,1.2,MUTED,cw-6);g.textAlign='center';g.font=fit(v,`600 14px ${body}`,cw-6);g.fillStyle=INK;g.fillText(v,x,336)});
    let h=hash(normEmpno(empno));const bars=[];for(let i=0;i<46;i++){h=(h*1103515245+12345)&0x7fffffff;bars.push(1+(h>>4)%3)}
    const bw=bars.reduce((t,w)=>t+w,0)+(bars.length-1)*2;let bx=W/2-bw/2;g.fillStyle=INK;bars.forEach(w=>{g.fillRect(bx,362,w,30);bx+=w+2});
    g.textAlign='center';g.font=`500 11px ${body}`;g.fillStyle=MUTED;g.fillText(empno,W/2,396);
    const fine=wrapLines('Property of Beastward Monster Removal. If found, return to Human Resources. Expires upon death.',`italic 500 12px ${body}`,W-40);
    g.font=`italic 500 12px ${body}`;fine.forEach((l,i)=>g.fillText(l,W/2,420+i*15));
  }else{

    g.textAlign='center';spC('BEASTWARD MONSTER REMOVAL',W/2,64,`600 10px ${disp}`,2.2,GREEN,W-40);
    spC('TERMS OF EMPLOYMENT',W/2,82,`600 9px ${disp}`,1.6,MUTED,W-40);
    g.strokeStyle=RULE;g.lineWidth=1;g.beginPath();g.moveTo(24,98);g.lineTo(W-24,98);g.stroke();
    const terms=['This badge is the property of Beastward Monster Removal and must be worn visibly while on assignment.','Present on request to any authority, client, or creature capable of asking.','Loss or damage must be reported to Human Resources within one business day. Replacement badges cost 25 gp.','If found on a corpse, please return badge to Beastward Monster Removal for processing.'];
    let y=108;g.textAlign='left';terms.forEach(t=>{const ls=wrapLines(t,`500 12px ${body}`,W-48);g.font=`500 12px ${body}`;g.fillStyle=INK;ls.forEach(l=>{g.fillText(l,24,y);y+=15});y+=6});
    y=Math.max(y+4,312);

    line('Bearer\u2019s signature',y+30);
    const yb=HH-72;let h=hash(normEmpno(empno));const bars=[];for(let i=0;i<46;i++){h=(h*1103515245+12345)&0x7fffffff;bars.push(1+(h>>4)%3)}
    const bw=bars.reduce((t,w)=>t+w,0)+(bars.length-1)*2;let bx=W/2-bw/2;g.fillStyle=INK;bars.forEach(w=>{g.fillRect(bx,yb,w,22);bx+=w+2});
    g.textAlign='center';g.font=`500 11px ${body}`;g.fillStyle=MUTED;g.fillText(empno,W/2,yb+26);

}
function makeBadgePDF(){
  const {jsPDF}=window.jspdf;const a=S.answers;
  const doc=new jsPDF({unit:'pt',format:'letter'});const W=612,H=792;
  const cardW=2.125*72,cardH=3.375*72,bleedIn=1/16,bleedPx=bleedIn/0.00664,bleedPt=bleedIn*72;
  const K=638/BADGE_W; // 300 dpi
  const front=badgeCanvas('front',K,bleedPx),back=badgeCanvas('back',K,bleedPx);
  const G=[27,109,78],MU=[78,100,87];
  let DF='times',F='times';try{doc.addFileToVFS('Cinzel-Bold.ttf',CINZEL_B64);doc.addFont('Cinzel-Bold.ttf','Cinzel','bold');DF='Cinzel';Object.entries(CG_B64).forEach(([st,b])=>{doc.addFileToVFS('CG-'+st+'.ttf',b);doc.addFont('CG-'+st+'.ttf','Cormorant',st)});F='Cormorant'}catch(e){}
  // one card per page, centered both ways, so front and back line up under any duplex flip
  const x0=(W-cardW)/2,y0=(H-cardH)/2;
  const place=(cv)=>{doc.addImage(cv.toDataURL('image/jpeg',.93),'JPEG',x0-bleedPt,y0-bleedPt,cardW+2*bleedPt,cardH+2*bleedPt);
    doc.setDrawColor(90,90,90);doc.setLineWidth(.5);const m=14;
    [[x0,y0],[x0+cardW,y0],[x0,y0+cardH],[x0+cardW,y0+cardH]].forEach(([cx,cy],i)=>{const dx=i%2?1:-1,dy=i<2?-1:1;doc.line(cx,cy+dy*(bleedPt+3),cx,cy+dy*(bleedPt+3+m));doc.line(cx+dx*(bleedPt+3),cy,cx+dx*(bleedPt+3+m),cy)})};
  const head=(side)=>{doc.setFont(DF,'bold');doc.setFontSize(9);doc.setTextColor(...G);doc.setCharSpace(1.5);doc.text('BEASTWARD MONSTER REMOVAL',W/2,52,{align:'center'});doc.setCharSpace(0);
    doc.setFont(F,'italic');doc.setFontSize(10);doc.setTextColor(...MU);doc.text(`Employee identification badge \u00b7 ${a.name||''} \u00b7 ${side}`,W/2,68,{align:'center'})};
  head('Front');place(front);
  const notes=['Print double-sided (flip on long edge) at 100% on card stock or photo paper. Do not fit to page.','Then cut along the crop marks. The faint border outside the marks is bleed and can be trimmed away.','Slide into a standard vertical badge holder, or laminate and punch a slot near the top.','No duplex printer? Print the two pages separately and glue back to back before cutting.','Finished size is 2.125 \u00d7 3.375 inches (CR80). Replacement badges cost 25 gp.'];
  doc.setFont(F,'normal');doc.setFontSize(9.5);doc.setTextColor(40,60,50);let ny=y0+cardH+bleedPt+44;notes.forEach(n=>{doc.text(n,W/2,ny,{align:'center'});ny+=15});
  doc.addPage();head('Back');place(back);
  doc.setFont(F,'italic');doc.setFontSize(9);doc.setTextColor(...MU);doc.text('Back of badge. This page prints on the reverse of page 1.',W/2,y0+cardH+bleedPt+44,{align:'center'});
  doc.save(`beastward_badge_${(a.name||'employee').replace(/[^A-Za-z0-9]+/g,'_')}.pdf`);
}
function drawBadge(){
